<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@700&family=DM+Mono&display=block">
</head><body style="margin:0"><canvas id="c" width="1200" height="630"></canvas><script>
(async()=>{
await Promise.all(['800 120px "Shippori Mincho B1"','800 52px "Shippori Mincho B1"','700 26px "Zen Kaku Gothic New"','400 20px "DM Mono"'].map(f=>document.fonts.load(f,'稼働を満開に。花吹雪パチンコスロ取材来店媒体HANAFUBUKIsakigake-info.github.io')));
const c=document.getElementById('c'),x=c.getContext('2d');
x.fillStyle='#FBF7F3';x.fillRect(0,0,1200,630);
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;const cols=['#F6D9DF','#EDBFC9','#C2214A','#F6D9DF'];
for(let i=0;i<60;i++){const px=r()*1200,py=r()*630,z=10+r()*16,cl=cols[(r()*4)|0],a=r()*6.28;if(px<520||px>820)continue;x.save();x.translate(px,py);x.rotate(a);x.fillStyle=cl;x.globalAlpha=cl==='#C2214A'?.6:.9;x.beginPath();x.ellipse(0,0,z/2,z*.35,0,0,6.283);x.fill();x.restore();}
x.globalAlpha=1;
// mark
x.save();x.translate(80,80);x.scale(56/32,56/32);
const P=[['M16 2c5 4 5 9 0 13-5-4-5-9 0-13z','#1D1A1E'],['M16 15c5-2 10 0 12 5-5 2-10 0-12-5z','#C2214A'],['M16 15c-5-2-10 0-12 5 5 2 10 0 12-5z','#1D1A1E'],['M16 15c2 5 1 10-3 14-2-5-1-10 3-14z','#EDBFC9'],['M16 15c-2 5-1 10 3 14 2-5 1-10-3-14z','#1D1A1E']];
P.forEach(([d,f])=>{x.fillStyle=f;x.fill(new Path2D(d));});x.restore();
x.fillStyle='#1D1A1E';x.textBaseline='middle';x.font='800 52px "Shippori Mincho B1"';x.letterSpacing='4px';x.fillText('花吹雪',152,110);
x.fillRect(338,92,2,36);x.fillStyle='#5E5860';x.font='400 18px "DM Mono"';x.letterSpacing='3.6px';x.fillText('HANAFUBUKI',354,111);
x.fillStyle='#1D1A1E';x.fillRect(80,340,40,3);x.font='700 26px "Zen Kaku Gothic New"';x.letterSpacing='3px';x.fillText('パチンコ・パチスロ 取材・来店媒体',136,342);
x.fillStyle='#5E5860';x.font='400 20px "DM Mono"';x.letterSpacing='0px';x.fillText('sakigake-info.github.io',80,546);
// vertical headline
x.font='800 120px "Shippori Mincho B1"';x.textBaseline='alphabetic';x.textAlign='center';
const col=(t,cx,col)=>{let y=52;for(const ch of t){x.fillStyle=col;if('、。'.includes(ch)){x.fillText(ch,cx+44,y+60);}else{x.fillText(ch,cx,y+104);}y+=132;}};
col('稼働を、',1044,'#1D1A1E');col('満開に。',906,'#C2214A');
c.toBlob(async b=>{const ab=await b.arrayBuffer();window._png=ab;try{parent.postMessage({ogp:ab},'*')}catch(e){}document.title='done';},'image/png');
})();
</script></body></html>
