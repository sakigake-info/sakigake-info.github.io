<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>取材結果一覧｜魁 -サキガケ-</title>
<meta name="description" content="魁（サキガケ）の取材結果を、取材名ごとにまとめた一覧です。">
<meta property="og:title" content="取材結果一覧｜魁 -サキガケ-">
<meta property="og:image" content="https://sakigake-info.github.io/ogp.png">
<meta name="theme-color" content="#0E0C0F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D1A1E'/%3E%3Ccircle cx='23' cy='9' r='4.5' fill='%23C8242F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E0C0F;--tile:#1B181C;--edge:rgba(255,255,255,.08);
  --bg:#FBF7F3;--paper:#FFFFFF;--ink:#1D1A1E;--muted:#6B6469;--line:#E7DED8;
  --beni:#C8242F;--beni-d:#A61C26;--beni-on-dark:#FF6A72;
  --jp:"Zen Kaku Gothic New",system-ui,sans-serif;--en:"Inter","Zen Kaku Gothic New",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
header{background:var(--night);color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;height:76px}
.top img{height:40px;display:block}
.top a.back{font-size:14px;color:#CFC6CB;text-decoration:none}
.top a.back:hover{color:#fff}
.hero{padding-top:56px;padding-bottom:64px;position:relative;overflow:hidden}
.hero .k{font:700 13px/1 var(--en);letter-spacing:.2em;color:var(--beni-on-dark);margin:0 0 18px}
.hero h1{font:900 clamp(36px,5vw,64px)/1.2 "Zen Old Mincho",serif;margin:0;letter-spacing:.04em}
.hero p{color:#CFC6CB;margin:18px 0 0;max-width:640px}
.hero .sl{position:absolute;left:-10%;right:-10%;bottom:28px;height:6px;background:var(--beni);transform:rotate(-3deg);opacity:.9}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:48px 0 32px}
.tab{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:10px 20px;font:700 15px/1 var(--jp);cursor:pointer;transition:background .2s,color .2s}
.tab small{font:600 12px/1 var(--en);margin-left:8px;opacity:.7}
.tab[aria-selected="true"],.tab:hover{background:var(--ink);color:#fff}
.group{margin-bottom:64px}
.ghd{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:24px}
.ghd h2{font:900 clamp(24px,3vw,34px)/1.3 "Zen Old Mincho",serif;margin:0}
.ghd p{margin:0;font-size:14px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.rc{background:var(--paper);border-radius:20px;padding:28px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px}
.rc .m{font:600 13px/1.6 var(--en);color:var(--muted);letter-spacing:.06em;margin:0}
.rc h3{font-size:19px;line-height:1.5;margin:0}
.rc .s{font-size:14px;color:var(--ink);margin:0}
.rc ul{list-style:none;margin:4px 0 0;padding:0;font-size:14px}
.rc li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:8px 0}
.rc li b{color:var(--beni)}
.rc a.p{margin-top:auto;font-size:13px;color:var(--beni)}
.empty{text-align:center;color:var(--muted);padding:56px 24px;border:1.5px dashed var(--line);border-radius:20px;background:var(--paper)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}
.empty a{display:inline-block;margin-top:18px;background:var(--beni);color:#fff;text-decoration:none;border-radius:999px;padding:12px 24px;font-weight:700;font-size:14px}
.note{font-size:12px;color:var(--muted);margin:0 0 72px}
footer{background:var(--night);color:#A49BA1;font-size:13px;padding:32px 0}
footer a{color:#fff}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.wrap{padding:0 16px}.cards{grid-template-columns:1fr}.top img{height:32px}.hero{padding-top:40px;padding-bottom:56px}}
</style>
</head>
<body>
<header>
  <div class="wrap top"><a href="index.html" aria-label="魁 サキガケ トップへ"><img src="logo-sakigake-w.png" alt="魁 サキガケ"></a><a class="back" href="index.html">← トップへ戻る</a></div>
  <div class="wrap hero">
    <p class="k">RESULTS</p>
    <h1>取材結果一覧。</h1>
    <p>魁が行った取材の結果を、取材名ごとにまとめています。</p>
    <i class="sl" aria-hidden="true"></i>
  </div>
</header>
<main class="wrap">
  <div class="tabs" id="tabs" role="tablist" aria-label="取材名"></div>
  <div id="list"></div>
  <p class="note">掲載内容は取材当日の記録です。</p>
</main>
<footer><div class="wrap">© 魁 -サキガケ-｜運営：株式会社Siu　<a href="privacy.html">プライバシーポリシー</a></div></footer>
<script>
/* 取材結果：取材名ごとに追加する。
   {name:"取材名", desc:"取材の説明（任意）", items:[[日付"YYYY-MM-DD", 店名, 出演, 一言まとめ, [[項目,値],...], 投稿URL(任意)], ...]} */
const RESULTS=[
];
(function(){
  const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const md=d=>`${+d.slice(0,4)}.${+d.slice(5,7)}.${+d.slice(8)}`;
  const tabs=document.getElementById("tabs"),list=document.getElementById("list");
  if(!RESULTS.length){tabs.style.display="none";list.style.margin="48px 0 24px";list.innerHTML='<div class="empty"><b>取材結果は、取材のあとここにまとめます。</b>取材名ごとに、日付・お店・当日のまとめを載せていきます。<br><a href="index.html#contact">取材のご相談はこちら</a></div>';return;}
  const card=r=>`<article class="rc"><p class="m">${md(r[0])} ／ ${esc(r[2])}</p><h3>${esc(r[1])}</h3>${r[3]?`<p class="s">${esc(r[3])}</p>`:""}${(r[4]||[]).length?`<ul>${r[4].map(x=>`<li><span>${esc(x[0])}</span><b>${esc(x[1])}</b></li>`).join("")}</ul>`:""}${r[5]?`<a class="p" href="${esc(r[5])}" target="_blank" rel="noopener">当日の投稿を見る →</a>`:""}</article>`;
  const group=g=>{const it=g.items.slice().sort((a,b)=>a[0]<b[0]?1:-1);return `<section class="group"><div class="ghd"><h2>${esc(g.name)}</h2><p>${it.length}件</p></div>${g.desc?`<p style="margin:-8px 0 20px;color:var(--muted);font-size:14px">${esc(g.desc)}</p>`:""}${it.length?`<div class="cards">${it.map(card).join("")}</div>`:'<div class="empty"><b>この取材の結果は、まだありません。</b></div>'}</section>`;};
  const all=["すべて",...RESULTS.map(g=>g.name)];let cur="すべて";
  const draw=()=>{tabs.innerHTML=all.map(n=>{const c=n==="すべて"?RESULTS.reduce((s,g)=>s+g.items.length,0):RESULTS.find(g=>g.name===n).items.length;return `<button type="button" class="tab" role="tab" aria-selected="${n===cur}">${esc(n)}<small>${c}</small></button>`}).join("");
    [...tabs.children].forEach((b,i)=>b.onclick=()=>{cur=all[i];draw();});
    list.innerHTML=(cur==="すべて"?RESULTS:RESULTS.filter(g=>g.name===cur)).map(group).join("");};
  const q=new URLSearchParams(location.search).get("t");if(q&&all.includes(q))cur=q;
  draw();
})();
</script>
</body>
</html>
